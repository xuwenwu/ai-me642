name: E2E Browser Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

jobs:
  playwright:
    name: Playwright pilot workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/e2e-ci.sqlite3
      SECRET_KEY: dev-secret-change-me
      SEED_DEMO_DATA: "true"
      UPLOAD_ROOT: data/e2e-uploads
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_INSTRUCTOR_EMAIL: instructor@example.edu
      E2E_INSTRUCTOR_PASSWORD: password123

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: |
          mkdir -p data
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &

      - name: Wait for backend readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat backend-e2e.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: npm run dev -- --hostname 127.0.0.1 --port 3000 > ../frontend-e2e.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat frontend-e2e.log
          exit 1

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Clean E2E data
        if: always()
        working-directory: backend
        run: python scripts/cleanup_e2e_data.py --confirm

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend-e2e.log
            frontend-e2e.log
